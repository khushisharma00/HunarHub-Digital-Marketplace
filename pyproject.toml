[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3"
site-package-path = [
    ".venv/lib/python3.12/site-packages",
    ".venv/lib/python3.14/site-packages",
    "/opt/anaconda3/lib/python3.12/site-packages"
]
search-path = [
    "."
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".venv/lib/python3.12/site-packages",
    ".venv/lib/python3.14/site-packages"
]
