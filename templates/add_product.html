<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Product | HunarHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-body">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div>
                                <h2 class="mb-1">Add New Product</h2>

                                <p class="text-muted mb-0">
                                    Add a handmade product to HunarHub
                                </p>
                            </div>

                            <a
                                href="{{ url_for('seller_dashboard') }}"
                                class="btn btn-outline-dark">

                                <i class="bi bi-arrow-left"></i>
                                Dashboard

                            </a>

                        </div>


                       <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data">

                            <div class="mb-3">

                                <label class="form-label">
                                    Product Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Example: Handmade Wooden Lamp"
                                    required>

                            </div>


                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <select
                                        name="category"
                                        class="form-select"
                                        required>

                                        <option value="">
                                            Select Category
                                        </option>

                                        <option value="Pottery">
                                            Pottery
                                        </option>

                                        <option value="Textiles">
                                            Textiles
                                        </option>

                                        <option value="Jewellery">
                                            Jewellery
                                        </option>

                                        <option value="Woodcraft">
                                            Woodcraft
                                        </option>

                                        <option value="Home Decor">
                                            Home Decor
                                        </option>

                                        <option value="Art">
                                            Art
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Price
                                    </label>

                                    <input
                                        type="number"
                                        name="price"
                                        class="form-control"
                                        placeholder="Example: 999"
                                        min="1"
                                        step="0.01"
                                        required>

                                </div>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Seller Name
                                </label>

                                <input
                                    type="text"
                                    name="seller"
                                    class="form-control"
                                    placeholder="Enter seller or artisan name"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Product Image Filename
                                </label>

                                <input
                                     type="file"
                                     name="image"
                                     class="form-control"
                                     accept="image/*"
                                     required>

                                <small class="text-muted">
                                    Image must be available inside static/images folder.
                                </small>

                            </div>


                            <div class="mb-4">

                                <label class="form-label">
                                    Product Description
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="5"
                                    placeholder="Describe the product, material and craftsmanship..."
                                    required></textarea>

                            </div>


                          <button type="submit" class="btn btn-success w-100">
                                  <i class="bi bi-plus-circle"></i>
                                   Add Product
                          </button>
                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
