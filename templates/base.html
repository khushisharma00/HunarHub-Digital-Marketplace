<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HunarHub{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.6">

    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('hunarhub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.setAttribute('data-theme', savedTheme);
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg hunar-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="logo-icon"><i class="bi bi-shop"></i></span>
                <span class="logo-text">Hunar<span>Hub</span></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <form action="{{ url_for('products') }}" method="GET" class="search-form">
                    <input type="text" name="search" placeholder="Search products, services or entrepreneurs..." value="{{ request.args.get('search', '') }}">
                    <button type="submit"><i class="bi bi-search"></i></button>
                </form>

                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#entrepreneurs">Entrepreneurs</a></li>

                    {% if session.get("user_id") %}
                        <li class="nav-item"><span class="nav-link">Hi, {{ session.get("user_name") }}</span></li>
                        <li class="nav-item"><a class="register-btn" href="{{ url_for('logout') }}">Logout</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link login-link" href="{{ url_for('login') }}">Login</a></li>
                        <li class="nav-item"><a class="register-btn" href="{{ url_for('register') }}">Register</a></li>
                    {% endif %}

                    <li class="nav-item">
                        <a class="cart-link" href="#" aria-label="Shopping cart">
                            <i class="bi bi-cart3"></i>
                            <span class="cart-count">0</span>
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <button id="themeToggleBtn" type="button" onclick="window.hunarhubToggleTheme ? window.hunarhubToggleTheme() : (function(){ var r=document.documentElement; var isD=r.getAttribute('data-bs-theme')==='dark'||r.classList.contains('dark'); var n=isD?'light':'dark'; r.setAttribute('data-bs-theme',n); r.setAttribute('data-theme',n); if(n==='dark'){r.classList.add('dark');if(document.body)document.body.classList.add('dark','dark-mode');}else{r.classList.remove('dark');if(document.body)document.body.classList.remove('dark','dark-mode');} localStorage.setItem('hunarhub_theme',n); })()" class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" title="Toggle Dark/Light Mode" aria-label="Toggle dark mode">
                            <i class="bi bi-moon-stars" id="themeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}?v=2.6"></script>
</body>

</html>
