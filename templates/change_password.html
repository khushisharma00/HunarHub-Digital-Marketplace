<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | HunarHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        body {
            background: #f5faf7;
        }

        .password-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .password-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .password-card h2 {
            font-weight: 700;
            color: #163c2f;
        }

        .password-card p {
            color: #6c757d;
        }

        .form-control {
            min-height: 50px;
            border-radius: 12px;
        }

        .btn-change {
            background: #1f7a5a;
            color: white;
            border: none;
            min-height: 50px;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-change:hover {
            background: #176348;
            color: white;
        }

    </style>

    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('hunarhub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.setAttribute('data-theme', savedTheme);
                if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>

<body>

<div class="password-wrapper">

    <div class="password-card">

        <h2>Change Password</h2>

        <p>
            Update your HunarHub account password securely.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-change w-100"
            >
                Change Password
            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{{ url_for('profile') }}">
                ← Back to Profile
            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
