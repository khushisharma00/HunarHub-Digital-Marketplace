<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Product | HunarHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('hunarhub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.setAttribute('data-theme', savedTheme);
                if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>

<body class="dashboard-body">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div>
                                <h2 class="mb-1">Edit Product</h2>

                                <p class="text-muted mb-0">
                                    Update product information
                                </p>
                            </div>

                            <a
                                href="{{ url_for('seller_dashboard') }}"
                                class="btn btn-outline-dark">

                                <i class="bi bi-arrow-left"></i>
                                Dashboard

                            </a>

                        </div>


                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Product Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ product['name'] }}"
                                    required>

                            </div>


                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <select
                                        name="category"
                                        class="form-select"
                                        required>

                                        <option value="Pottery"
                                            {% if product['category'] == 'Pottery' %}selected{% endif %}>
                                            Pottery
                                        </option>

                                        <option value="Textiles"
                                            {% if product['category'] == 'Textiles' %}selected{% endif %}>
                                            Textiles
                                        </option>

                                        <option value="Jewellery"
                                            {% if product['category'] == 'Jewellery' %}selected{% endif %}>
                                            Jewellery
                                        </option>

                                        <option value="Woodcraft"
                                            {% if product['category'] == 'Woodcraft' %}selected{% endif %}>
                                            Woodcraft
                                        </option>

                                        <option value="Home Decor"
                                            {% if product['category'] == 'Home Decor' %}selected{% endif %}>
                                            Home Decor
                                        </option>

                                        <option value="Art"
                                            {% if product['category'] == 'Art' %}selected{% endif %}>
                                            Art
                                        </option>

                                    </select>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Price
                                    </label>

                                    <input
                                        type="number"
                                        name="price"
                                        class="form-control"
                                        value="{{ product['price'] }}"
                                        min="1"
                                        step="0.01"
                                        required>

                                </div>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Seller Name
                                </label>

                                <input
                                    type="text"
                                    name="seller"
                                    class="form-control"
                                    value="{{ product['seller'] }}"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Product Image Filename
                                </label>

                                <input
                                    type="text"
                                    name="image"
                                    class="form-control"
                                    value="{{ product['image'] }}"
                                    required>

                                <small class="text-muted">
                                    Image must exist inside static/images folder.
                                </small>

                            </div>


                            <div class="mb-4">

                                <label class="form-label">
                                    Product Description
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="5"
                                    required>{{ product['description'] }}</textarea>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-warning w-100 py-2">

                                <i class="bi bi-pencil-square"></i>
                                Update Product

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
