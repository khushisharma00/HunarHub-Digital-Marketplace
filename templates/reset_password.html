<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | HunarHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('hunarhub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                document.documentElement.setAttribute('data-theme', savedTheme);
                if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="auth-grid single-card-grid">
            <section class="auth-form-section">
                <div class="auth-form-container">
                    <a href="{{ url_for('login') }}" class="back-home-link">
                        <i class="bi bi-arrow-left"></i>
                        Back to Login
                    </a>

                    <div class="auth-heading">
                        <span>Security</span>
                        <h2>Set New Password</h2>
                        <p>Create a strong new password with at least 8 characters.</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" class="auth-form">
                        <div class="auth-field">
                            <label for="password">New Password</label>
                            <div class="auth-input-wrapper">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
                                <button type="button" class="password-toggle" id="togglePass" aria-label="Toggle password view">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="confirm_password">Confirm New Password</label>
                            <div class="auth-input-wrapper">
                                <i class="bi bi-shield-lock"></i>
                                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" minlength="8" required>
                                <button type="button" class="password-toggle" id="toggleConfirm" aria-label="Toggle confirm password view">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="auth-submit-btn">
                            Save New Password
                            <i class="bi bi-check2-circle ms-1"></i>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;
            btn.addEventListener('click', function() {
                const isPass = input.type === 'password';
                input.type = isPass ? 'text' : 'password';
                this.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });
        }
        setupToggle('togglePass', 'password');
        setupToggle('toggleConfirm', 'confirm_password');
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
